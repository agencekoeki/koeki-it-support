<title id="l-t">La boucle de raisonnement</title>
<desc id="l-d">La boucle de raisonnement en neuf étapes, de 0 à 8 : trier, énoncer le problème, chercher ce qui a changé, gestes gratuits, observer le symptôme, classer les hypothèses, en tester une, vérifier, remettre le journal. Les étapes 0 à 4 ne modifient rien sur le PC.</desc>
